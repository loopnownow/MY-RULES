# aliases.yaml — 旧名 → 现行名映射（机器可读，唯一来源）
#
# 契约：
#   1. 规则正文（*.md）不得出现旧名；旧名只在本文件出现。
#   2. 本文件是「读旧名」的接口，不是「用旧名」的许可：status=retired 的旧名只用于识别与更正。
#   3. fine-id 旧名不在这里，归 {SKILLS}\00_orchestrator\legacy_aliases.yaml。
#   4. 消费者：check_paths.py（现状）、qc_rules.py（P5 接入）。脚本只读字段，不解析散文。
#
# 字段：
#   old     旧写法（规范形式，路径或 token）
#   tokens  可选；正文里可能出现的变体（用于 grep / 正则）
#   new     现行写法；retired / nonexistent 项写去向或留空
#   kind    root | dir | stage | ref_dir | file | repo | version | syn_target | family_code
#   status  renamed | retired | alias | false_target | false_stage | nonexistent | merged | superseded
#   since   生效日期（YYYY-MM-DD）；未知留空，不猜
#   ref     依据（t-id / 文件名）
#   note    一句说明；不写规则正文

